name: CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev, "release/**"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # tox builds its own isolated env from pyproject.toml, so the runner
      # needs only tox itself.
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run black, isort, flake8 (check)
        run: tox -e lint
      - name: Run mypy
        run: tox -e type

  test:
    name: Test (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      # The py3.11 leg runs the same suite under coverage instead of a third
      # job re-running it; [tool.coverage.report] fail_under gates the job.
      - name: Run tox for py${{ matrix.python-version }}
        run: |
          case "${{ matrix.python-version }}" in
            "3.11") tox -e coverage ;;
            "3.12") tox -e py312 ;;
          esac
      - name: Upload coverage HTML
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

# Note: Linux parity is a known follow-up for a future release.
# Daily Driver ships macOS arm64 only.
