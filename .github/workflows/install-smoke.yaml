name: Install smoke test

on:
  pull_request:
    branches: [main, dev, "release/**"]
  push:
    branches: [main, dev, "release/**"]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  smoke:
    name: pip install from source (py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create clean venv and install from checkout
        run: |
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          pip install .
      - name: Assert entry point resolves
        run: |
          source /tmp/smoke-venv/bin/activate
          which daily-driver
          daily-driver --version
      - name: Assert import works
        run: |
          source /tmp/smoke-venv/bin/activate
          python -c "import daily_driver; print(daily_driver.__version__)"
      # Freshness is checked against the INSTALLED package, not the source
      # tree: init renders the workspace config from the bundled template, so
      # the copy inside the wheel is the one that reaches a user. The Makefile
      # lint target runs the equivalent source-tree diff for local feedback.
      - name: Assert shipped config template is fresh
        run: |
          source /tmp/smoke-venv/bin/activate
          python -m daily_driver.core.config_template > /tmp/config-template-generated.j2
          SHIPPED=$(python -c "import importlib.resources as r; print(r.files('daily_driver.resources.templates').joinpath('.dd-config.yaml.j2'))")
          # joinpath does not check existence, and diff exits 2 for a missing
          # file just as it does for a real difference -- so absence must be
          # ruled out first or a packaging break reads as a stale template.
          if [ ! -f "$SHIPPED" ]; then
            echo "::error::.dd-config.yaml.j2 is missing from the installed package; check the package-data patterns in pyproject.toml"
            exit 1
          fi
          if ! diff -u "$SHIPPED" /tmp/config-template-generated.j2; then
            echo "::error::the shipped config template does not match the models that generate it; run 'make setup && make config-template' and commit the result"
            exit 1
          fi
      - name: Workspace smoke (init + doctor + tracker)
        run: |
          source /tmp/smoke-venv/bin/activate
          daily-driver init /tmp/dd-ws
          daily-driver --workspace /tmp/dd-ws doctor
          daily-driver --workspace /tmp/dd-ws tracker add --category task --title "smoke task"
          daily-driver --workspace /tmp/dd-ws tracker list --json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['data']['entries'][0]['title']=='smoke task', d"
          test -d /tmp/dd-ws/.claude/commands/daily-driver
          test -s /tmp/dd-ws/.claude/settings.local.json

# Linux parity deferred to a future release.
